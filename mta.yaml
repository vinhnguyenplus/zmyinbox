_schema-version: "3.3"
ID: approval-inbox
version: 1.0.0
description: CAP-backed SAP Fiori freestyle Approval Inbox.

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm run build:cap

modules:
  - name: approval-inbox-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
      instances: 1
      routes:
        - route: approval-inbox-srv.cfapps.ap21.hana.ondemand.com
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: zsale-db

  - name: approval-inbox-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: zsale-db

resources:
  - name: zsale-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: zsale-db
